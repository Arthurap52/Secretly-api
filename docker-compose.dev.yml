services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: secretly_api_dev
    volumes:
      - .:/app
      - db_data_dev:/app/data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/secretly.db
      - ENVIRONMENT=development
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  db_data_dev:


